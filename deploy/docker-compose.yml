# RiJi 单节点编排
#
# 用法：
#   cp deploy/.env.example deploy/.env      # 改里面的密码与密钥
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 多节点：每个节点一份 compose，各自独立的 db 与 media 卷；
# 副本节点额外配置 RJJ_NODE_ROLE=replica、RJJ_PRIMARY_URL、RJJ_TLS_DIR。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 里设置}
      POSTGRES_DB: ${POSTGRES_DB:-riji}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-riji} -d ${POSTGRES_DB:-riji}']
      interval: 10s
      timeout: 5s
      retries: 10
    # 数据库不对公网暴露（需求 10.5）
    expose:
      - '5432'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RJJ_HOST: 0.0.0.0
      RJJ_PORT: '8080'
      RJJ_DATABASE_URL: postgres://${POSTGRES_USER:-riji}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-riji}
      RJJ_MEDIA_DIR: /data/media
      RJJ_JWT_SECRET: ${RJJ_JWT_SECRET:?必须在 .env 里设置}
      RJJ_NODE_ID: ${RJJ_NODE_ID:-node-1}
      RJJ_NODE_ROLE: ${RJJ_NODE_ROLE:-primary}
      RJJ_PRIMARY_URL: ${RJJ_PRIMARY_URL:-}
      RJJ_REPLICATION_TOKEN: ${RJJ_REPLICATION_TOKEN:-}
      RJJ_TLS_DIR: ${RJJ_TLS_DIR:-}
      RJJ_REPLICATION_PORT: ${RJJ_REPLICATION_PORT:-9443}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${RJJ_PORT:-8080}:8080'
      # 节点间 mTLS 端口：只应对其他节点开放，不要暴露到公网
      - '${RJJ_TLS_PORT:-9443}:9443'
    volumes:
      - media:/data/media
      # 启用 mTLS 时挂载证书目录（只读）
      # - ./certs:/certs:ro  # noqa
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/healthz || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
  media:
